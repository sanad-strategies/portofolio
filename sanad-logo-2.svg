<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Mark: a simple lintel-and-pillars motif, echoing "support / foundation" -->
  <g stroke="#333A29" stroke-width="3.2" fill="none" stroke-linecap="round">
    <!-- top beam -->
    <line x1="10" y1="14" x2="54" y2="14"/>
    <!-- left pillar -->
    <line x1="16" y1="14" x2="16" y2="62"/>
    <!-- right pillar -->
    <line x1="48" y1="14" x2="48" y2="62"/>
    <!-- base -->
    <line x1="8" y1="62" x2="56" y2="62"/>
    <!-- center support -->
    <line x1="32" y1="26" x2="32" y2="62"/>
    <line x1="20" y1="30" x2="44" y2="30"/>
  </g>
  <text x="72" y="52" font-family="Cormorant Garamond, serif" font-style="italic" font-weight="500" font-size="38" fill="#333A29">Sanad</text>
</svg>
